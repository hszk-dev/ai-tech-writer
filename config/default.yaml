# AI Tech Writer - Default Configuration

llm:
  default_model: "claude-sonnet-4-20250514"
  temperature: 0.7
  max_tokens: 4096

pipeline:
  stages:
    - ideation
    - outline
    - draft
    - review
  max_revisions: 3
  revision_threshold: 8.0  # スコアがこの値以上なら改善ループを終了（1-10）
  validate_code: true      # コードブロックの構文検証を行う
  execute_code: false      # Dockerでコード実行検証を行う（要Docker）
  save_intermediate: true

# Docker sandbox settings (execute_code: true の場合に使用)
sandbox:
  timeout: 30              # 実行タイムアウト（秒）
  memory_limit: "256m"     # メモリ制限
  cpu_limit: 0.5           # CPU制限（0.5 = 50%）
  languages:               # 実行対象言語（空の場合は全対応言語）
    - python
    - javascript

output:
  platform: "zenn"
  default_emoji: "📝"
  default_type: "tech"
  output_dir: "outputs"

web_search:
  provider: "tavily"
  num_results: 10
  include_answer: true
  optimize_queries: true      # LLMで検索クエリを最適化
  enable_cache: true          # 検索結果をキャッシュ
  cache_ttl_hours: 24         # キャッシュの有効期限（時間）

prompts:
  dir: "config/prompts"

# Tree Search settings (--treesearch オプション使用時)
treesearch:
  enabled: false              # デフォルトは無効
  max_iterations: 10          # 最大イテレーション数
  beam_width: 3               # 同時展開ノード数
  max_depth: 4                # 最大探索深度
  score_threshold: 8.5        # この値以上で探索終了（1-10）
  parallel_workers: 3         # 並列ワーカー数
  rate_limit_per_minute: 20   # LLM APIコール制限（/分）
  max_nodes: 100              # 最大ノード数
  prune_keep_top: 20          # 枝刈り時に保持する上位ノード数

# Project Analysis settings (--project オプション使用時)
project_analysis:
  enabled: true               # プロジェクト分析機能の有効化
  max_files: 100              # 分析対象の最大ファイル数
  include_patterns:           # 分析対象ファイルパターン
    - "*.py"
    - "*.ts"
    - "*.tsx"
    - "*.js"
    - "*.jsx"
    - "*.go"
    - "*.rs"
    - "*.java"
    - "*.rb"
  exclude_patterns:           # 除外パターン
    - "node_modules/**"
    - ".git/**"
    - "__pycache__/**"
    - "*.lock"
    - ".venv/**"
    - "venv/**"
    - "dist/**"
    - "build/**"
  analysis_depth: "standard"  # quick/standard/comprehensive
  cache_enabled: true         # 分析結果のキャッシュ
  cache_ttl_hours: 168        # キャッシュ有効期限（168時間 = 1週間）
