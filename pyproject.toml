[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-tech-writer"
version = "0.1.0"
description = "AI-powered technical article writer for Zenn/Qiita"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "AI Tech Writer" }
]
keywords = ["ai", "llm", "technical-writing", "zenn", "qiita"]

dependencies = [
    "litellm>=1.0.0",
    "tavily-python>=0.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "aiolimiter>=1.1.0",
    "claude-code-sdk>=0.0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
ai-tech-writer = "ai_tech_writer.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_tech_writer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/config",
    "/templates",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
